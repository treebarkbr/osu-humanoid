name: eval
on:
  workflow_dispatch:
    inputs:
      tasks:
        description: "path to task JSON in the repo (e.g. jobs/current.json)"
        required: true
        default: "jobs/current.json"
      shards:
        description: "JSON list of shard indices, e.g. [0,1,2,3,4,5,6,7]"
        required: false
        default: "[0,1,2,3,4,5,6,7]"

jobs:
  eval:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJson(github.event.inputs.shards || '[0,1,2,3,4,5,6,7]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install numpy osrparse
          pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Run shard
        run: |
          python scripts/eval_maps.py --tasks "${{ github.event.inputs.tasks }}" \
            --shard "${{ matrix.shard }}/${{ strategy.job-total }}" \
            --out "result_${{ matrix.shard }}.json"
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: result-${{ matrix.shard }}
          path: result_${{ matrix.shard }}.json
          if-no-files-found: warn
