name: eval
on:
  workflow_dispatch:
    inputs:
      maps:
        description: "comma list of .osu filenames"
        required: true
        default: "924759.osu,1021349.osu,1092090.osu,1093245.osu,1093507.osu,110175.osu,1104798.osu,1119026.osu"
      candidates_b64:
        description: "base64 JSON list of {id, tap_patch}; empty = baseline"
        required: false
        default: ""
      shards:
        description: "JSON list of shard indices, e.g. [0,1,2,3,4,5,6,7]"
        required: false
        default: "[0,1,2,3,4,5,6,7]"
      profile:
        description: "human noise profile"
        required: false
        default: "average"
      seed:
        description: "rng seed"
        required: false
        default: "0"

jobs:
  eval:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJson(github.event.inputs.shards || '[0,1,2,3,4,5,6,7]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install numpy osrparse
          pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Run shard
        env:
          MAPS: ${{ github.event.inputs.maps }}
          CANDIDATES_B64: ${{ github.event.inputs.candidates_b64 }}
          PROFILE: ${{ github.event.inputs.profile }}
          SEED: ${{ github.event.inputs.seed }}
        run: |
          if [ -n "$CANDIDATES_B64" ]; then
            python scripts/eval_maps.py --candidates-b64 "$CANDIDATES_B64" --maps "$MAPS" \
              --profile "$PROFILE" --seed "$SEED" \
              --shard "${{ matrix.shard }}/${{ strategy.job-total }}" \
              --out "result_${{ matrix.shard }}.json"
          else
            python scripts/eval_maps.py --maps "$MAPS" \
              --profile "$PROFILE" --seed "$SEED" \
              --shard "${{ matrix.shard }}/${{ strategy.job-total }}" \
              --out "result_${{ matrix.shard }}.json"
          fi
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: result-${{ matrix.shard }}
          path: result_${{ matrix.shard }}.json
          if-no-files-found: warn
