name: eval
on:
  workflow_dispatch:
    inputs:
      tasks:
        description: "path to task JSON in the repo (e.g. jobs/current.json)"
        required: true
        default: "jobs/current.json"
      shards:
        description: "number of parallel shards"
        required: false
        default: "8"

jobs:
  eval:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJson(format('[{0}]', join(range(0, fromJson(inputs.shards)), ','))) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install numpy
          pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Run shard
        run: |
          python scripts/eval_maps.py --tasks "${{ inputs.tasks }}" \
            --shard "${{ matrix.shard }}/${{ inputs.shards }}" \
            --out "result_${{ matrix.shard }}.json"
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: result-${{ matrix.shard }}
          path: result_${{ matrix.shard }}.json
          if-no-files-found: warn
